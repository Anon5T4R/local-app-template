  <path d="M 180 196 C 180 120, 332 120, 332 200 C 332 258, 260 268, 260 318"
        fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="260" cy="376" r="26" fill="#FFFFFF"/>
</svg>
